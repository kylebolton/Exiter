<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exiter Settings</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src data:">
<link rel="stylesheet" href="../theme/fonts.css">
<style>
  :root { --bg:#fff; --fg:#09090b; --muted:#f4f4f5; --mfg:#71717a; --border:#e4e4e7; --primary:#18181b; --pfg:#fafafa; --radius:8px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --fg:#fafafa; --muted:#27272a; --mfg:#a1a1aa; --border:#27272a; --primary:#fafafa; --pfg:#18181b; } }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; letter-spacing:-0.011em; -webkit-font-smoothing:antialiased; }
  body { padding: 0 28px 40px; user-select: none; }
  .drag { height: 44px; -webkit-app-region: drag; margin: 0 -28px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 4px 0 2px; letter-spacing:-0.02em; }
  header p { margin:0 0 20px; color:var(--mfg); }
  section { border:1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow:hidden; }
  section > h2 { font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--mfg); margin:0; padding:12px 16px 8px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 16px; border-top:1px solid var(--border); min-height:48px; }
  .row:first-of-type { border-top:0; }
  .row .t { display:flex; flex-direction:column; }
  .row .t b { font-weight:500; }
  .row .t span { color:var(--mfg); font-size:13px; }
  /* switch */
  .switch { position:relative; width:36px; height:20px; flex:none; }
  .switch input { opacity:0; position:absolute; inset:0; margin:0; cursor:pointer; z-index:1; }
  .switch i { position:absolute; inset:0; background:var(--border); border-radius:999px; transition:background .15s; }
  .switch i::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .15s; }
  .switch input:checked + i { background:var(--primary); }
  .switch input:checked + i::after { transform:translateX(16px); background:var(--pfg); }
  .switch input:focus-visible + i { outline:2px solid var(--mfg); outline-offset:2px; }
  /* segmented */
  .seg { display:inline-flex; background:var(--muted); border-radius:var(--radius); padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; color:var(--mfg); font:inherit; font-weight:500; padding:4px 12px; border-radius:6px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--bg); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  /* swatches */
  .sw { display:flex; gap:8px; }
  .sw button { width:22px; height:22px; border-radius:50%; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--border); cursor:pointer; padding:0; }
  .sw button[aria-pressed="true"] { box-shadow:0 0 0 2px var(--mfg); }
  /* range */
  .range { display:flex; align-items:center; gap:10px; }
  .range output { width:44px; text-align:right; color:var(--mfg); font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; width:140px; height:4px; background:var(--border); border-radius:4px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--bg); border:1px solid var(--mfg); box-shadow:0 1px 2px rgba(0,0,0,.15); cursor:pointer; }
  .actions { display:flex; justify-content:space-between; align-items:center; color:var(--mfg); font-size:13px; }
  .btn { border:1px solid var(--border); background:transparent; color:var(--fg); font:inherit; font-weight:500; padding:6px 12px; border-radius:var(--radius); cursor:pointer; }
  .btn:hover { background:var(--muted); }
</style>
</head>
<body>
  <div class="drag"></div>
  <header><h1>Settings</h1><p>Changes apply instantly.</p></header>
  <main id="root"></main>
  <div class="actions"><span>Shortcuts: ⌘⇧X show/hide · ⌘⇧N new post</span><button class="btn" id="reset">Reset to defaults</button></div>
  <script src="settings.js"></script>
</body>
</html>
