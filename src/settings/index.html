<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exiter Settings</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src data:">
<link rel="stylesheet" href="../theme/fonts.css">
<link rel="stylesheet" href="../theme/tokens.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="drag"></div>
  <header>
    <h1>Settings</h1>
  </header>
  <nav id="sections" aria-label="Settings sections"></nav>
  <main id="root"></main>
  <footer>
    <span id="shortcuts"></span>
    <button class="btn" id="reset" type="button" disabled>Reset to defaults</button>
  </footer>
  <div id="status" role="status"></div>
  <dialog id="confirm-reset" aria-labelledby="reset-title">
    <form method="dialog">
      <h2 id="reset-title">Reset settings?</h2>
      <p>Appearance, sidebar and app preferences will return to their defaults.</p>
      <div class="dialog-actions">
        <button class="btn" type="submit" value="cancel" autofocus>Cancel</button>
        <button class="btn primary" type="submit" value="reset">Reset settings</button>
      </div>
    </form>
  </dialog>
  <script src="settings.js"></script>
</body>
</html>
