<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exiter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme/fonts.css">
<link rel="stylesheet" href="theme/tokens.css">
<script>
  if (new URLSearchParams(location.search).get('dark') === '1') document.documentElement.dataset.exTheme = 'dark';
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    min-height:100%; margin:0; background:var(--background); color:var(--foreground);
    font:14px/1.5 var(--font-sans); letter-spacing:-0.011em; -webkit-font-smoothing:antialiased;
  }
  body { min-height:100vh; display:grid; place-items:center; padding:40px 24px; -webkit-app-region:drag; }
  main {
    width:min(100%, 382px); padding:28px; border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow-pop); -webkit-app-region:no-drag; animation:enter var(--ex-dur) var(--ex-ease);
  }
  svg { display:block; padding:10px; border-radius:10px; background:var(--muted); }
  h1 { font-size:22px; font-weight:650; letter-spacing:-0.035em; margin:14px 0 4px; }
  p { margin:0 0 18px; color:var(--muted-foreground); }
  button {
    font:inherit; font-weight:550; border:0; border-radius:var(--radius); background:var(--primary);
    color:var(--primary-foreground); padding:7px 14px; cursor:pointer; transition:opacity var(--ex-dur-fast), scale var(--ex-dur-fast);
  }
  button:hover { opacity:.85; }
  button:active { scale:.97; }
  button:focus-visible { outline:2px solid var(--muted-foreground); outline-offset:3px; }
  button:disabled { opacity:.65; cursor:progress; }
  @keyframes enter { from { opacity:0; translate:0 4px; } }
  @media (prefers-reduced-motion: reduce) {
    main, button { animation:none; transition:none; scale:none; }
  }
</style>
</head>
<body>
  <main>
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <path d="M3 9a15 15 0 0 1 18 0M6 13a10 10 0 0 1 12 0M9 17a5 5 0 0 1 6 0m-3 4h.01M3 3l18 18"/>
    </svg>
    <h1>Can't reach X</h1>
    <p>Check your connection. Exiter will retry on its own when you're back online.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    const retry = document.getElementById('retry');
    const requested = new URLSearchParams(location.search).get('retry');
    const destination = requested?.startsWith('https://x.com/') ? requested : 'https://x.com/home';
    const reconnect = () => {
      if (retry.disabled) return;
      retry.disabled = true;
      retry.textContent = 'Reconnecting…';
      location.replace(destination);
    };
    retry.addEventListener('click', reconnect);
    window.addEventListener('online', reconnect);
    setInterval(() => { if (navigator.onLine) reconnect(); }, 8000);
  </script>
</body>
</html>
